<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Medical Record</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        <script>
        const token = localStorage.getItem("doctorToken");
        const params = new URLSearchParams(window.location.search);
        let patientId = params.get("patient_id") || localStorage.getItem("patientId");

        if (!token || !patientId) {
            window.location.replace("login.html");
        }

        localStorage.setItem("patientId", patientId);

        // ✅ TOKEN VALIDATION
        fetch("https://migrantwokerscentralisedplatform-1.onrender.com/check/token", {
            headers: { "Authorization": "Bearer " + token }
        })
        .then(res => { if (!res.ok) forceLogout(); })
        .catch(() => forceLogout());

        // 🚫 Disable back button
        window.history.pushState(null,null,location.href);
        window.onpopstate = ()=>window.history.pushState(null,null,location.href);

        function forceLogout(){
            localStorage.clear();
            window.location.replace("login.html");
        }
    </script>
    </script>

    <style>
        :root{
            --bg:#f0f9ff;
            --card:#ffffff;
            --primary:#0284c7;
            --secondary:#0ea5e9;
            --success:#22c55e;
            --border:#e2e8f0;
            --text:#0f172a;
            --muted:#64748b;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family:Segoe UI,Arial;
            background:linear-gradient(180deg,#e0f2fe,#f8fafc);
            color:var(--text);
        }
        header{
            background:linear-gradient(135deg,#0369a1,#0284c7);
            color:white;
            padding:22px 32px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        header span{font-size:22px;font-weight:800;}
        header button{
            background:#0ea5e9;
            border:none;
            color:white;
            padding:10px 18px;
            border-radius:999px;
            cursor:pointer;
        }
        .container{
            max-width:1100px;
            margin:auto;
            padding:36px 20px;
        }
        .card{
            background:var(--card);
            border-radius:26px;
            padding:40px;
            box-shadow:0 25px 60px rgba(0,0,0,.1);
        }
        .tabs{
            display:flex;
            gap:14px;
            margin-bottom:30px;
        }
        .tab{
            flex:1;
            padding:14px;
            border-radius:999px;
            background:#e0f2fe;
            font-weight:700;
            text-align:center;
            cursor:pointer;
        }
        .tab.active{
            background:var(--primary);
            color:white;
        }
        .tab-content{display:none;}
        .tab-content.active{display:block;}
        .form-group{margin-bottom:18px;}
        label{font-weight:700;margin-bottom:6px;display:block;}
        input,textarea,select{
            width:100%;
            padding:14px;
            border-radius:14px;
            border:1px solid var(--border);
        }
        textarea{min-height:90px;}
        .row{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
            gap:20px;
        }
        .test-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
            gap:18px;
        }
        .test-card{
            border:1px solid var(--border);
            border-radius:18px;
            padding:18px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#f8fafc;
        }
        .test-info h4{margin:0;font-size:16px;}
        .test-info p{margin:4px 0 0;color:var(--muted);font-size:13px;}
        .switch{
            position:relative;
            width:46px;
            height:26px;
        }
        .switch input{display:none;}
        .slider{
            position:absolute;
            cursor:pointer;
            inset:0;
            background:#cbd5e1;
            border-radius:999px;
            transition:.3s;
        }
        .slider:before{
            content:"";
            position:absolute;
            height:20px;
            width:20px;
            left:3px;
            top:3px;
            background:white;
            border-radius:50%;
            transition:.3s;
        }
        .switch input:checked + .slider{
            background:var(--success);
        }
        .switch input:checked + .slider:before{
            transform:translateX(20px);
        }
        .actions{
            margin-top:34px;
            display:flex;
            gap:16px;
        }
        .btn{
            padding:16px 32px;
            border-radius:999px;
            border:none;
            font-weight:800;
            cursor:pointer;
            color:white;
        }
        .btn.save{background:var(--primary);}
        .btn.reset{background:#64748b;}
    </style>
</head>

<body>

<header>
    <span>📝 Add Medical Record</span>
    <button onclick="window.location.href='main_page.html'">Back</button>
</header>

<div class="container">
    <div class="card">

        <div class="tabs">
            <div class="tab active" onclick="openTab('clinical',this)">Clinical</div>
            <div class="tab" onclick="openTab('tests',this)">Tests</div>
            <div class="tab" onclick="openTab('reports',this)">Reports</div>
        </div>

        <form id="recordForm" enctype="multipart/form-data">

            <!-- CLINICAL -->
            <div id="clinical" class="tab-content active">
                <div class="row">
                    <div class="form-group">
                        <label>Patient ID</label>
                        <input name="patient_id" required>
                    </div>
                    <div class="form-group">
                        <label>Hospital Name</label>
                        <input name="hospital_name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <select name="department">
                        <option>Cardiology</option>
                        <option>ENT</option>
                        <option>Neurology</option>
                        <option>Orthopedics</option>
                        <option>General Medicine</option>
                    </select>
                </div>

                <label>Diagnosis</label>
                <textarea name="diagnosis"></textarea>

                <label>Prescription</label>
                <textarea name="prescription"></textarea>

                <label>Doctor Notes</label>
                <textarea name="notes"></textarea>
            </div>

            <!-- TESTS -->
            <div id="tests" class="tab-content">
                <div class="test-grid">
                    <div class="test-card">
                        <div class="test-info"><h4>Blood Test</h4></div>
                        <label class="switch">
                            <input type="checkbox" value="Blood Test">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="test-card">
                        <div class="test-info"><h4>X-Ray</h4></div>
                        <label class="switch">
                            <input type="checkbox" value="X-Ray">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="form-group" style="margin-top:18px;">
                    <label>Other Test</label>
                    <input id="customTest">
                </div>
            </div>

            <!-- REPORTS -->
            <div id="reports" class="tab-content">
                <div class="form-group">
                    <label>Report Category</label>
                    <select id="reportCategory">
                        <option value="">No report</option>
                        <option value="Blood Test">Blood Test</option>
                        <option value="Imaging">Imaging</option>
                        <option value="Prescription">Prescription</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Report Type</label>
                    <select id="reportType">
                        <option value="">Select report</option>
                        <option value="LFT">LFT</option>
                        <option value="CBC">CBC</option>
                        <option value="XRAY">X-Ray</option>
                        <option value="CUSTOM">Other</option>
                    </select>
                </div>

                <div class="form-group" id="otherReportBox" style="display:none;">
                    <label>Specify Report Name</label>
                    <input id="otherReport">
                </div>

                <div class="form-group">
                    <label>Upload Report File</label>
                    <input type="file" id="reportFile">
                </div>
            </div>

            <div class="actions">
                <button class="btn save">Save Record</button>
                <button class="btn reset" type="reset">Reset</button>
            </div>

        </form>
    </div>
</div>

<script>
    function openTab(id,el){
        document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));
        el.classList.add("active");
        document.getElementById(id).classList.add("active");
    }

    reportType.addEventListener("change",()=>{
        otherReportBox.style.display =
            reportType.value==="CUSTOM"?"block":"none";
    });

    recordForm.addEventListener("submit",e=>{
        e.preventDefault();

        /* CONFIRM BEFORE SUBMIT */
        if(!confirm("Are you sure you want to submit this record?")) return;

        const fd=new FormData(recordForm);

        const tests=[];
        document.querySelectorAll("#tests input[type=checkbox]:checked")
            .forEach(cb=>tests.push(cb.value));
        if(customTest.value.trim()) tests.push(customTest.value.trim());
        if(tests.length) fd.append("tests",tests.join(", "));

        if(reportCategory.value) fd.append("report_category",reportCategory.value);
        if(reportType.value) fd.append("report_type",reportType.value);
        if(otherReport.value) fd.append("report_name",otherReport.value);
        if(reportFile.files.length) fd.append("report_file",reportFile.files[0]);

        console.log("===== FORM DATA =====");
        for(let [k,v] of fd.entries()){
            console.log(k, v instanceof File ? v.name : v);
        }

        fetch("https://migrantwokerscentralisedplatform-1.onrender.com/doctor/add/patient/diagnosis/prescription/medical_notes",{
            method:"POST",
            headers:{Authorization:"Bearer "+token},
            body:fd
        })
        .then(r=>r.json())
        .then(d=>{
            alert(d.message || "Saved");

            /* CLEAR FORM AFTER SUCCESS */
            recordForm.reset();
            customTest.value="";
            document.querySelectorAll("#tests input[type=checkbox]").forEach(cb=>cb.checked=false);
            otherReportBox.style.display="none";
            openTab("clinical",document.querySelector(".tab"));
        });
    });
</script>

</body>
</html>
