<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Medical Record</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ================= AUTH & TOKEN CHECK ================= -->
    <script>
        const token = localStorage.getItem("doctorToken");
        const params = new URLSearchParams(window.location.search);
        const patientId = params.get("patient_id") || localStorage.getItem("patientId");

        if (!token || !patientId) {
            window.location.replace("login.html");
        }

        localStorage.setItem("patientId", patientId);

        /* Token validation */
        fetch("https://migrantwokerscentralisedplatform-1.onrender.com/check/token", {
            headers: { Authorization: "Bearer " + token }
        })
        .then(res => { if (!res.ok) logout(); })
        .catch(logout);

        function logout(){
            localStorage.clear();
            window.location.replace("login.html");
        }

        /* Disable back button */
        window.history.pushState(null,null,location.href);
        window.onpopstate = ()=>window.history.pushState(null,null,location.href);
    </script>

    <!-- ================= STYLES ================= -->
    <style>
        :root{
            --bg:#f0f9ff;
            --card:#ffffff;
            --primary:#0284c7;
            --success:#22c55e;
            --border:#e2e8f0;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family:Segoe UI,Arial;
            background:linear-gradient(180deg,#e0f2fe,#f8fafc);
        }
        header{
            background:#0284c7;
            color:white;
            padding:20px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        header button{
            border:none;
            background:#0ea5e9;
            color:white;
            padding:10px 18px;
            border-radius:20px;
            cursor:pointer;
        }
        .container{
            max-width:1100px;
            margin:auto;
            padding:30px;
        }
        .card{
            background:white;
            border-radius:20px;
            padding:30px;
            box-shadow:0 20px 40px rgba(0,0,0,.1);
        }
        .tabs{
            display:flex;
            gap:10px;
            margin-bottom:25px;
        }
        .tab{
            flex:1;
            padding:12px;
            text-align:center;
            border-radius:20px;
            background:#e0f2fe;
            cursor:pointer;
            font-weight:bold;
        }
        .tab.active{
            background:var(--primary);
            color:white;
        }
        .tab-content{display:none;}
        .tab-content.active{display:block;}

        .form-group{margin-bottom:16px;}
        label{font-weight:bold;display:block;margin-bottom:6px;}
        input,textarea,select{
            width:100%;
            padding:12px;
            border-radius:12px;
            border:1px solid var(--border);
        }
        textarea{min-height:90px;}

        .row{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
            gap:15px;
        }
        .test-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
            gap:15px;
        }
        .test-card{
            border:1px solid var(--border);
            border-radius:14px;
            padding:15px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .actions{
            margin-top:30px;
            display:flex;
            gap:15px;
        }
        .btn{
            padding:14px 30px;
            border-radius:30px;
            border:none;
            font-weight:bold;
            color:white;
            cursor:pointer;
        }
        .btn.save{background:var(--primary);}
        .btn.reset{background:#64748b;}
    </style>
</head>

<body>

<header>
    <h2>📝 Add Medical Record</h2>
    <button onclick="location.href='main_page.html'">Back</button>
</header>

<div class="container">
    <div class="card">

        <div class="tabs">
            <div class="tab active" onclick="openTab('clinical',this)">Clinical</div>
            <div class="tab" onclick="openTab('tests',this)">Tests</div>
            <div class="tab" onclick="openTab('reports',this)">Reports</div>
        </div>

        <form id="recordForm" enctype="multipart/form-data">

            <!-- ================= CLINICAL ================= -->
            <div id="clinical" class="tab-content active">
                <div class="row">
                    <div class="form-group">
                        <label>Patient ID</label>
                        <input name="patient_id" id="patient_id" readonly required>
                    </div>
                    <div class="form-group">
                        <label>Hospital Name</label>
                        <input name="hospital_name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <select name="department">
                        <option>General Medicine</option>
                        <option>Cardiology</option>
                        <option>ENT</option>
                        <option>Neurology</option>
                        <option>Orthopedics</option>
                    </select>
                </div>

                <label>Diagnosis</label>
                <textarea name="diagnosis"></textarea>

                <label>Prescription</label>
                <textarea name="prescription"></textarea>

                <label>Doctor Notes</label>
                <textarea name="notes"></textarea>
            </div>

            <!-- ================= TESTS ================= -->
            <div id="tests" class="tab-content">
                <div class="test-grid">
                    <div class="test-card">
                        <span>Blood Test</span>
                        <input type="checkbox" name="tests" value="Blood Test">
                    </div>
                    <div class="test-card">
                        <span>X-Ray</span>
                        <input type="checkbox" name="tests" value="X-Ray">
                    </div>
                </div>

                <div class="form-group" style="margin-top:15px;">
                    <label>Other Test</label>
                    <input id="customTest">
                </div>
            </div>

            <!-- ================= REPORTS ================= -->
            <div id="reports" class="tab-content">
                <div class="form-group">
                    <label>Report Category</label>
                    <select id="reportCategory">
                        <option value="">No report</option>
                        <option>Blood Test</option>
                        <option>Imaging</option>
                        <option>Prescription</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Report Type</label>
                    <select id="reportType">
                        <option value="">Select</option>
                        <option>CBC</option>
                        <option>LFT</option>
                        <option>XRAY</option>
                        <option value="CUSTOM">Other</option>
                    </select>
                </div>

                <div class="form-group" id="otherReportBox" style="display:none;">
                    <label>Report Name</label>
                    <input id="otherReport">
                </div>

                <div class="form-group">
                    <label>Upload Report</label>
                    <input type="file" id="reportFile">
                </div>
            </div>

            <div class="actions">
                <button class="btn save" type="submit">Save Record</button>
                <button class="btn reset" type="reset">Reset</button>
            </div>

        </form>
    </div>
</div>

<!-- ================= SCRIPTS ================= -->
<script>
    document.getElementById("patient_id").value = patientId;

    function openTab(id,el){
        document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));
        el.classList.add("active");
        document.getElementById(id).classList.add("active");
    }

    reportType.addEventListener("change",()=>{
        otherReportBox.style.display = reportType.value==="CUSTOM"?"block":"none";
    });

    recordForm.addEventListener("submit",e=>{
        e.preventDefault();
        if(!confirm("Submit this record?")) return;

        const fd=new FormData(recordForm);

        const tests=[];
        document.querySelectorAll("input[name='tests']:checked")
            .forEach(cb=>tests.push(cb.value));
        if(customTest.value.trim()) tests.push(customTest.value.trim());
        if(tests.length) fd.append("tests",tests.join(", "));

        if(reportCategory.value) fd.append("report_category",reportCategory.value);
        if(reportType.value) fd.append("report_type",reportType.value);
        if(otherReport.value) fd.append("report_name",otherReport.value);
        if(reportFile.files.length) fd.append("report_file",reportFile.files[0]);

        fetch("https://migrantwokerscentralisedplatform-1.onrender.com/doctor/add/patient/diagnosis/prescription/medical_notes",{
            method:"POST",
            headers:{Authorization:"Bearer "+token},
            body:fd
        })
        .then(r=>r.json())
        .then(d=>{
            alert(d.message || "Record Saved");
            recordForm.reset();
            patient_id.value = patientId;
            otherReportBox.style.display="none";
            openTab("clinical",document.querySelector(".tab"));
        });
    });
</script>

</body>
</html>
