<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Medical Record</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        window.token = localStorage.getItem("doctorToken");

        if (!window.token) {
            alert("Doctor not logged in");
            window.location.replace("doctor_login.html");
        }

        fetch("https://migrantwokerscentralisedplatform-1.onrender.com/check/token", {
            headers: { Authorization: "Bearer " + window.token }
        })
        .then(res => { if (!res.ok) logout(); })
        .catch(logout);

        function logout(){
            localStorage.clear();
            window.location.replace("doctor_login.html");
        }

        window.history.pushState(null,null,location.href);
        window.onpopstate = ()=>window.history.pushState(null,null,location.href);
    </script>

    <style>
        :root{--primary:#0284c7;--border:#e2e8f0}
        *{box-sizing:border-box}
        body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(180deg,#e0f2fe,#f8fafc);}
        header{background:#0284c7;color:white;padding:20px 30px;display:flex;justify-content:space-between;}
        .container{max-width:1100px;margin:auto;padding:30px;}
        .card{background:white;border-radius:20px;padding:30px;box-shadow:0 20px 40px rgba(0,0,0,.1);}
        .tabs{display:flex;gap:10px;margin-bottom:25px;}
        .tab{flex:1;padding:12px;text-align:center;border-radius:20px;background:#e0f2fe;font-weight:bold;cursor:pointer;}
        .tab.active{background:var(--primary);color:white;}
        .tab-content{display:none;}
        .tab-content.active{display:block;}
        input,textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);}
        textarea{min-height:90px;}
        .actions{margin-top:30px;}
        .btn{padding:14px 30px;border-radius:30px;border:none;font-weight:bold;color:white;background:var(--primary);}
    </style>
</head>

<body>

<header>
    <h2>📝 Add Medical Record</h2>
</header>

<div class="container">
    <div class="card">

        <div class="tabs">
            <div class="tab active" onclick="openTab('clinical',this)">Clinical</div>
            <div class="tab" onclick="openTab('tests',this)">Tests</div>
            <div class="tab" onclick="openTab('reports',this)">Reports</div>
        </div>

        <form id="recordForm" enctype="multipart/form-data">

            <!-- CLINICAL -->
            <div id="clinical" class="tab-content active">
                <input name="patient_id" placeholder="Patient ID" required>
                <input name="hospital_name" placeholder="Hospital Name" required>
                <textarea name="diagnosis" placeholder="Diagnosis"></textarea>
                <textarea name="prescription" placeholder="Prescription"></textarea>
                <textarea name="notes" placeholder="Doctor Notes"></textarea>
            </div>

            <!-- TESTS -->
            <div id="tests" class="tab-content">
                <input type="checkbox" value="Blood Test" class="testOpt"> Blood Test<br>
                <input type="checkbox" value="X-Ray" class="testOpt"> X-Ray<br>
                <input id="customTest" placeholder="Other Test">
            </div>

            <!-- REPORTS -->
            <div id="reports" class="tab-content">
                <select id="reportCategory">
                    <option value="">No report</option>
                    <option>Blood Test</option>
                    <option>Imaging</option>
                    <option>Prescription</option>
                    <option>Other</option>
                </select>

                <select id="reportType">
                    <option value="">Select</option>
                    <option>CBC</option>
                    <option>LFT</option>
                    <option>XRAY</option>
                    <option value="CUSTOM">Other</option>
                </select>

                <input id="otherReport" placeholder="Report Name">
                <input type="file" id="reportFile">
            </div>

            <div class="actions">
                <button class="btn" type="submit">Save Record</button>
            </div>

        </form>
    </div>
</div>

<script>
    function openTab(id, el){
        document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));
        el.classList.add("active");
        document.getElementById(id).classList.add("active");
    }

    recordForm.addEventListener("submit", async e => {
        e.preventDefault();

        if(!confirm("Submit this record?")) return;

        const fd = new FormData();

        /* ===== FORCE ALL KEYS (IMPORTANT PART) ===== */

        fd.set("patient_id", recordForm.patient_id.value.trim());
        fd.set("hospital_name", recordForm.hospital_name.value.trim());

        fd.set("diagnosis", recordForm.diagnosis.value.trim() || "None");
        fd.set("prescription", recordForm.prescription.value.trim() || "None");
        fd.set("notes", recordForm.notes.value.trim() || "None");

        /* TESTS */
        const tests = [];
        document.querySelectorAll(".testOpt:checked")
            .forEach(cb => tests.push(cb.value));
        if(customTest.value.trim()) tests.push(customTest.value.trim());
        fd.set("tests", tests.length ? tests.join(", ") : "None");

        /* REPORTS */
        fd.set("report_category", reportCategory.value || "None");
        fd.set("report_type", reportType.value || "None");
        fd.set("report_name", otherReport.value.trim() || "None");

        /* FILE */
        if (reportFile.files.length) {
            fd.set("report_file", reportFile.files[0]);
        }

        console.log("FINAL DATA:");
        for (const [k,v] of fd.entries()) console.log(k, v);

        try {
            const res = await fetch(
                "https://migrantwokerscentralisedplatform-1.onrender.com/doctor/add/patient/diagnosis/prescription/medical_notes",
                {
                    method: "POST",
                    headers: { Authorization: "Bearer " + window.token },
                    body: fd
                }
            );

            const data = await res.json();
            alert(data.message || "Saved");
            recordForm.reset();
            openTab("clinical", document.querySelector(".tab"));
        }
        catch(err){
            console.error(err);
            alert("Request failed");
        }
    });
</script>

</body>
</html>
