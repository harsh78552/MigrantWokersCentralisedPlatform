<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Doctor Login</title>
    <style>

        body{
            margin: 0;
            height:100vh;
            font-family:Arial,sans-serif;
        }

        .overlay{
            position:fixed;
            inset:0;
            background:linear-gradient(
                to right,
                rgba(0,0,0,0) 0%,
                rgba(0,0,0,0.15) 55%,
                rgba(0,0,0,0.35) 100%);
            display:flex;
            justify-content:flex-end;
            align-items:center;
            padding-right:6%;
        }

        .login-container{
            width:360px;
            padding:32px 34px;
            background:rgba(255,255,255,0.18);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border-radius:18px;
            border:1px solid rgba(255,255,255,.35);
        }

        h2{
            color:white;
            text-align:center;
            margin-bottom:24px;
        }

        label{
            color:white;
            font-size:13px;
            display:block;
            margin-top:12px;
        }

        input{
            width:100%;
            padding:12px;
            border-radius:10px;
            border:none;
            margin-top:6px;
            outline:none;
        }

        button{
            width:100%;
            padding:13px;
            margin-top:16px;
            border-radius:10px;
            border:none;
            cursor:pointer;
            font-size:15px;
        }

        .btn-login{
            background:#2563eb;
            color:white;
            font-weight:bold;
        }

        .btn-login:hover{
            background:#1d4ed8;
        }

        .btn-signup{
            background:transparent;
            color:white;
            border:1px solid white;
        }

        .btn-signup:hover{
            background:rgba(255,255,255,0.15);
        }
    </style>

</head>
<body>
<div class="overlay">
    <div class="login-container">
        <h2>Doctor Login</h2>

        <form id="loginForm">
            <label>Email</label>
            <input type="email" id="email" required>

            <label>Password</label>
            <input type="password" id="password" required>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <button class="btn-signup"
                onclick="window.location.href='registeration.html'">
            Sign Up
        </button>
    </div>
</div>
<script>

    function togglePassword() {
        const passwordInput = document.getElementById("password");
        const toggleText = document.getElementById("toggleText");

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleText.innerText = "Hide";
        } else {
            passwordInput.type = "password";
            toggleText.innerText = "Show";
        }
    }
    async function loginUser(email, password) {
        try {
            const response = await fetch("https://migrantwokerscentralisedplatform-1.onrender.com/doctor/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem("doctorToken", data.access_token);
                window.location.href = "main_page.html";
            } else {
                showToast("Login failed: " + (data.message || "Invalid credentials"));
            }
        } catch (error) {
            console.error(error);
            showToast("Something went wrong. Try again.");
        }
    }

    document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!email || !password) {
            showToast("Please enter email and password");
            return;
        }

        loginUser(email, password);
    });

    function showToast(message) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.innerText = message;
        document.body.appendChild(toast);

        setTimeout(() => toast.remove(), 3000);
    }

</script>
</body>
</html>
