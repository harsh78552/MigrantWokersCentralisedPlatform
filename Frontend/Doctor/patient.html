<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Management</title>
    <script>
        const token = localStorage.getItem("doctorToken");

        if (!token) {
            window.location.replace("login.html");
        } else {
            fetch("https://migrantwokerscentralisedplatform-1.onrender.com/check/token", {
                headers: { "Authorization": "Bearer " + token }
            })
            .then(res => {
                if (!res.ok) handleLogout();
            })
            .catch(() => handleLogout());
        }

        function handleLogout() {
            localStorage.removeItem("doctorToken");
            window.location.replace("login.html");
        }
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        /* Navbar */
        .navbar {
            background-color: #2c3e50;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .nav-buttons button {
            margin-left: 10px;
            padding: 8px 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            color: white;
        }

        .back-btn { background: #3498db; }
        .logout-btn { background: #e74c3c; }

        /* Content */
        .container {
            padding: 30px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-box input {
            padding: 8px;
            width: 220px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .search-box button {
            padding: 8px 14px;
            margin-left: 8px;
            background: #2ecc71;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #ecf0f1;
        }

        .btn {
            padding: 6px 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            color: white;
        }

        .records-btn { background: #9b59b6; }
        .reports-btn { background: #16a085; }

        .no-data {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 8px;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <h2>Patient Management</h2>
    <div class="nav-buttons">
        <button class="back-btn" onclick="goBack()">Dashboard</button>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

<!-- Main Content -->
<div class="container">

    <div class="page-header">
        <h2>Search Patient</h2>
        <div class="search-box">
            <input type="text" id="patientIdInput" placeholder="Enter Patient ID">
            <button onclick="searchPatient()">Search</button>
        </div>
    </div>

    <table id="patientTable" style="display:none;">
        <thead>
        <tr>
            <th>Patient ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="patientBody"></tbody>
    </table>

    <div id="noData" class="no-data" style="display:none;">
        No patient found for this Patient ID.
    </div>

</div>

<script>
    function goBack() {
        window.location.href = "main_page.html";
    }

    function searchPatient() {
        const patientId = document.getElementById("patientIdInput").value.trim();
        if (!patientId) {
            alert("Please enter Patient ID");
            return;
        }

        fetch(`https://migrantwokerscentralisedplatform-1.onrender.com/doctor/fetch/patient/information?patient_id=${patientId}`, {
            headers: { "Authorization": "Bearer " + token }
        })
        .then(res => {
            if (!res.ok) throw new Error();
            return res.json();
        })
        .then(data => {
            document.getElementById("noData").style.display = "none";
            document.getElementById("patientTable").style.display = "table";

            document.getElementById("patientBody").innerHTML = `
            <tr>
                <td>${data.patient_id}</td>
                <td>${data.name}</td>
                <td>${data.age}</td>
                <td>${data.gender}</td>
                <td>
                    <button class="btn records-btn"
                        onclick="openMedicalRecords('${data.patient_id}')">
                        Medical Records
                    </button>
                    <button class="btn reports-btn"
                        onclick="openMedicalReports('${data.patient_id}')">
                        Medical Reports
                    </button>
                </td>
            </tr>`;
        })
        .catch(() => {
            document.getElementById("patientTable").style.display = "none";
            document.getElementById("noData").style.display = "block";
        });
    }

    function openMedicalRecords(id) {
        window.location.href = `medical_records.html?patient_id=${id}`;
    }

    function openMedicalReports(id) {
        window.location.href = `medical_reports.html?patient_id=${id}`;
    }


    function logout() {
        fetch("https://migrantwokerscentralisedplatform-1.onrender.com/doctor-logout", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token
            }
        })
        .finally(() => {
            // Always clear frontend token
            localStorage.removeItem("doctorToken");
            window.location.replace("login.html");
        });
    }
</script>

</body>
</html>
