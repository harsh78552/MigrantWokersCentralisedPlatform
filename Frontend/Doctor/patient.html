<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patients</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        /* Navbar */
        .navbar {
            background-color: #2c3e50;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .nav-buttons button {
            margin-left: 10px;
            padding: 8px 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            color: white;
        }

        .back-btn { background: #3498db; }
        .logout-btn { background: #e74c3c; }

        /* Page Content */
        .container {
            padding: 30px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .page-header h2 {
            margin: 0;
        }

        .search-box input {
            padding: 8px;
            width: 220px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #ecf0f1;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .btn {
            padding: 6px 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            color: white;
        }

        .view-btn { background: #2ecc71; }
        .record-btn { background: #9b59b6; }

        .no-data {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 8px;
            color: #777;
        }
    </style>

    <!-- 🔐 Auth Guard -->
    <script>
        const token = localStorage.getItem("doctorToken");
        if (!token) {
            window.location.replace("doctor_login.html");
        }
    </script>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <h2>Patients</h2>
    <div class="nav-buttons">
        <button class="back-btn" onclick="goBack()">Dashboard</button>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

<!-- Main Content -->
<div class="container">

    <!-- Header -->
    <div class="page-header">
        <h2>Patient List</h2>
        <div class="search-box">
            <input type="text" placeholder="Search patient...">
        </div>
    </div>

    <!-- Patient Table -->
    <table>
        <thead>
        <tr>
            <th>Patient ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Last Visit</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <!-- Example Row -->
        <tr>
            <td>PAT001</td>
            <td>Ramesh Kumar</td>
            <td>35</td>
            <td>Male</td>
            <td>02-Jan-2026</td>
            <td>
                <button class="btn view-btn" onclick="viewPatient('PAT001')">View</button>
                <button class="btn record-btn" onclick="addRecord('PAT001')">Add Record</button>
            </td>
        </tr>

        <tr>
            <td>PAT002</td>
            <td>Sita Devi</td>
            <td>28</td>
            <td>Female</td>
            <td>28-Dec-2025</td>
            <td>
                <button class="btn view-btn" onclick="viewPatient('PAT002')">View</button>
                <button class="btn record-btn" onclick="addRecord('PAT002')">Add Record</button>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- If no patients -->
    <!--
    <div class="no-data">
        No patients assigned yet.
    </div>
    -->

</div>

<script>
    function goBack() {
        window.location.href = "doctor_dashboard.html";
    }

    function viewPatient(id) {
        window.location.href = "patient_profile.html?id=" + id;
    }

    function addRecord(id) {
        window.location.href = "add_record.html?id=" + id;
    }

    function logout() {
        fetch("https://migrantwokerscentralisedplatform-1.onrender.com/doctor/logout", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + localStorage.getItem("doctorToken")
            }
        })
        .finally(() => {
            localStorage.removeItem("doctorToken");
            window.location.replace("doctor_login.html");
        });
    }
</script>

</body>
</html>
