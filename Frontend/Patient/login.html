<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 13px;
            color: #007bff;
            user-select: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-login {
            background: #007bff;
            color: white;
        }

        .btn-login:hover {
            background: #0056b3;
        }

        .btn-signup {
            background: #28a745;
            color: white;
        }

        .btn-signup:hover {
            background: #218838;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: #fff;
            padding: 12px 20px;
            border-radius: 6px;
            opacity: 0.9;
            font-size: 14px;
            z-index: 1000;
            animation: fadeOut 3s forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 0.9; }
            80% { opacity: 0.9; }
            100% { opacity: 0; }
        }
    </style>
</head>

<body>

<div class="login-container">
    <h2>User Login</h2>

    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" required>
                <span class="toggle-password" id="toggleText" onclick="togglePassword()">Show</span>
            </div>
        </div>

        <button type="submit" class="btn-login">Login</button>
    </form>

    <button class="btn-signup" onclick="window.location.href='registeration.html'">
        Sign Up
    </button>
</div>

<script>
    // 🔁 Show / Hide password
    function togglePassword() {
        const passwordInput = document.getElementById("password");
        const toggleText = document.getElementById("toggleText");

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleText.innerText = "Hide";
        } else {
            passwordInput.type = "password";
            toggleText.innerText = "Show";
        }
    }

    // 🔐 Login logic
    async function loginUser(email, password) {
        try {
            const response = await fetch("http://127.0.0.1:5000/patient/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem("patientToken", data.access_token);
                window.location.href = "main_page.html";
            } else {
                showToast("Login failed: " + (data.message || "Invalid credentials"));
            }
        } catch (error) {
            console.error(error);
            showToast("Something went wrong. Try again.");
        }
    }

    document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!email || !password) {
            showToast("Please enter email and password");
            return;
        }

        loginUser(email, password);
    });

    // 🔔 Toast message
    function showToast(message) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.innerText = message;
        document.body.appendChild(toast);

        setTimeout(() => toast.remove(), 3000);
    }
</script>

</body>
</html>
