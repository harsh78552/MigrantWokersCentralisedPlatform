<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Login</title>

    <style>
        :root{
            --primary:#2563eb;
            --primary-dark:#1e40af;
            --success:#16a34a;
            --bg1:#e0ecff;
            --bg2:#f8fafc;
            --card:#ffffffcc;
            --border:#e5e7eb;
            --text:#1e293b;
            --muted:#64748b;
        }

        *{box-sizing:border-box}

        body{
            margin:0;
            font-family:"Segoe UI",Arial,sans-serif;
            background:linear-gradient(135deg,var(--bg1),var(--bg2));
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-container{
            width:380px;
            padding:36px 34px;
            background:var(--card);
            backdrop-filter:blur(10px);
            border-radius:18px;
            box-shadow:0 25px 60px rgba(0,0,0,.18);
            text-align:center;
        }

        .logo{
            width:56px;
            height:56px;
            border-radius:50%;
            background:linear-gradient(135deg,var(--primary),#60a5fa);
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-weight:900;
            font-size:22px;
            margin:0 auto 14px;
        }

        h2{
            margin:6px 0;
            color:var(--text);
        }

        .subtitle{
            font-size:13px;
            color:var(--muted);
            margin-bottom:26px;
        }

        .form-group{
            margin-bottom:18px;
            text-align:left;
        }

        label{
            font-size:13px;
            font-weight:700;
            color:var(--text);
            margin-bottom:6px;
            display:block;
        }

        input{
            width:100%;
            padding:12px 14px;
            border-radius:10px;
            border:1px solid var(--border);
            font-size:14px;
            transition:.2s;
        }

        input:focus{
            outline:none;
            border-color:var(--primary);
            box-shadow:0 0 0 3px #2563eb22;
        }

        .password-wrapper{
            position:relative;
        }

        .toggle-password{
            position:absolute;
            right:14px;
            top:50%;
            transform:translateY(-50%);
            font-size:12px;
            font-weight:700;
            color:var(--primary);
            cursor:pointer;
            user-select:none;
        }

        button{
            width:100%;
            padding:13px;
            border:none;
            border-radius:10px;
            font-size:15px;
            font-weight:800;
            cursor:pointer;
            transition:.25s;
        }

        .btn-login{
            background:linear-gradient(135deg,var(--primary),#3b82f6);
            color:white;
            margin-top:10px;
        }

        .btn-login:hover{
            transform:translateY(-1px);
            box-shadow:0 8px 18px rgba(37,99,235,.35);
        }

        .divider{
            margin:22px 0;
            font-size:12px;
            color:var(--muted);
            position:relative;
        }

        .divider::before,
        .divider::after{
            content:"";
            height:1px;
            width:30%;
            background:var(--border);
            position:absolute;
            top:50%;
        }

        .divider::before{left:0}
        .divider::after{right:0}

        .btn-signup{
            background:var(--success);
            color:white;
        }

        .btn-signup:hover{
            opacity:.9;
            transform:translateY(-1px);
        }

        .toast{
            position:fixed;
            bottom:24px;
            right:24px;
            background:#111827;
            color:white;
            padding:12px 18px;
            border-radius:10px;
            font-size:14px;
            animation:fadeOut 3s forwards;
            box-shadow:0 10px 20px rgba(0,0,0,.3);
        }

        @keyframes fadeOut{
            0%{opacity:1}
            80%{opacity:1}
            100%{opacity:0}
        }
    </style>
</head>

<body>

<div class="login-container">
    <div class="logo">+</div>
    <h2>Patient Login</h2>
    <div class="subtitle">Secure access to your health records</div>

    <form id="loginForm">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="••••••••" required>
                <span class="toggle-password" id="toggleText" onclick="togglePassword()">Show</span>
            </div>
        </div>

        <button type="submit" class="btn-login">Login</button>
    </form>

    <div class="divider">OR</div>

    <button class="btn-signup" onclick="window.location.href='registeration.html'">
        Create New Account
    </button>
</div>

<script>
    function togglePassword(){
        const p=document.getElementById("password");
        const t=document.getElementById("toggleText");
        if(p.type==="password"){p.type="text";t.innerText="Hide";}
        else{p.type="password";t.innerText="Show";}
    }

    async function loginUser(email,password){
        try{
            const response=await fetch("http://127.0.0.1:5000/patient/login",{
                method:"POST",
                headers:{ "Content-Type":"application/json" },
                body:JSON.stringify({ email,password })
            });
            const data=await response.json();
            if(response.ok){
                localStorage.setItem("patientToken",data.access_token);
                localStorage.setItem("patientId",data.patient_id);
                window.location.href=`main_page.html?patient_id=${data.patient_id}`;
            }else{
                showToast("Login failed: "+(data.message||"Invalid credentials"));
            }
        }catch(e){
            showToast("Something went wrong. Try again.");
        }
    }

    document.getElementById("loginForm").addEventListener("submit",e=>{
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password=document.getElementById("password").value.trim();
        if(!email||!password){showToast("Please enter email and password");return;}
        loginUser(email,password);
    });

    function showToast(msg){
        const t=document.createElement("div");
        t.className="toast";
        t.innerText=msg;
        document.body.appendChild(t);
        setTimeout(()=>t.remove(),3000);
    }
</script>

</body>
</html>
