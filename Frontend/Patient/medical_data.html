<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Health Records</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- AUTH + PATIENT ID -->
    <script>
        const token = localStorage.getItem("patientToken");
        const params = new URLSearchParams(window.location.search);
        let patientId = params.get("patient_id") || localStorage.getItem("patientId");

        if (!token || !patientId) {
            window.location.replace("login.html");
        }

        localStorage.setItem("patientId", patientId);

        fetch("https://migrantwokerscentralisedplatform-1.onrender.com/check/token", {
            headers: { "Authorization": "Bearer " + token }
        })
        .then(res => { if (!res.ok) forceLogout(); })
        .catch(() => forceLogout());

        function forceLogout(){
            localStorage.clear();
            window.location.replace("login.html");
        }
    </script>

    <!-- YOUR ORIGINAL STYLES (UNCHANGED) -->
    <style>
        :root{
            --primary:#0a4fbf;
            --primary-dark:#083a8f;
            --accent:#eaf1ff;
            --bg:#f2f6fb;
            --card:#ffffff;
            --border:#dbe2ea;
            --text:#1e293b;
            --muted:#64748b;
            --medical:#2563eb;
            --test:#059669;
        }

        *{box-sizing:border-box}

        body{
            margin:0;
            font-family:"Segoe UI", Arial, sans-serif;
            background:var(--bg);
            color:var(--text);
        }

        /* ===== HEADER ===== */
        header{
            background:linear-gradient(135deg,#0a4fbf,#1e6fff);
            color:white;
            padding:22px 28px;
            box-shadow:0 4px 10px rgba(0,0,0,.15);
        }

        header h1{
            margin:0;
            font-size:23px;
            font-weight:700;
        }

        /* ===== TOP BAR ===== */
        .topbar{
            background:white;
            padding:14px 28px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid var(--border);
        }

        .left{
            display:flex;
            align-items:center;
            gap:14px;
        }

        .back-btn{
            padding:8px 14px;
            border-radius:6px;
            border:1px solid var(--border);
            background:#f8fafc;
            font-weight:700;
            cursor:pointer;
            color:var(--text);
        }

        .back-btn:hover{
            background:#eef2f7;
        }

        .badge{
            background:var(--accent);
            color:var(--primary);
            padding:6px 12px;
            border-radius:20px;
            font-size:12px;
            font-weight:700;
        }

        /* ===== TABS ===== */
        .tabs{
            display:flex;
            gap:12px;
        }

        .tab-btn{
            padding:10px 20px;
            border-radius:6px;
            border:1px solid var(--border);
            background:#f9fafb;
            font-weight:700;
            cursor:pointer;
            color:var(--text);
        }

        .tab-btn.active{
            background:var(--primary);
            color:white;
            border-color:var(--primary);
        }

        /* ===== CARD ===== */
        .container{
            max-width:1200px;
            margin:26px auto;
            background:var(--card);
            border-radius:12px;
            box-shadow:0 12px 28px rgba(0,0,0,.08);
            overflow:hidden;
        }

        /* ===== TABLE ===== */
        .table-header,
        .row{
            display:grid;
            grid-template-columns:140px 1.3fr 1fr 120px 120px;
            padding:16px 22px;
            align-items:center;
        }

        .table-header{
            background:#f1f5fb;
            font-weight:800;
            font-size:14px;
            color:#334155;
            border-bottom:1px solid var(--border);
        }

        .row{
            border-bottom:1px solid var(--border);
            font-size:14px;
        }

        .row:hover{
            background:#f8fbff;
        }

        /* ===== TAGS ===== */
        .tag{
            display:inline-block;
            padding:5px 12px;
            font-size:12px;
            font-weight:800;
            border-radius:20px;
            color:white;
            text-align:center;
        }

        .tag.medical{background:var(--medical)}
        .tag.test{background:var(--test)}

        /* ===== BUTTON ===== */
        .btn{
            padding:8px 16px;
            border:none;
            border-radius:6px;
            background:var(--primary);
            color:white;
            font-size:13px;
            font-weight:700;
            cursor:pointer;
        }

        .btn:hover{
            background:var(--primary-dark);
        }

        /* ===== STATES ===== */
        .empty, .error{
            padding:50px;
            text-align:center;
            font-size:14px;
        }

        .empty{color:var(--muted)}
        .error{color:#dc2626}

        /* ===== FOOTER ===== */
        footer{
            text-align:center;
            padding:18px;
            font-size:12px;
            color:var(--muted);
        }
    </style>
</head>

<body>

<header>
    <h1>Patient Health Records</h1>
</header>

<div class="topbar">
    <div class="left">
        <div class="badge">Patient ID: <span id="pid"></span></div>
    </div>
    <div class="tabs">
        <button id="medicalTab" class="tab-btn active" onclick="loadMedical()">Medical</button>
        <button id="testTab" class="tab-btn" onclick="loadTests()">Test</button>
    </div>
</div>

<div class="container">
    <div class="table-header">
        <div>Date</div>
        <div>Hospital / Lab</div>
        <div>Department / Test</div>
        <div>Type</div>
        <div>Action</div>
    </div>
    <div id="records">
        <div class="empty">Loading health records…</div>
    </div>
</div>

<script>
    document.getElementById("pid").innerText = patientId;
    const recordsBox = document.getElementById("records");

    function setActive(tab){
        medicalTab.classList.remove("active");
        testTab.classList.remove("active");
        document.getElementById(tab).classList.add("active");
    }

    /* ===== MEDICAL ===== */
    function loadMedical(){
        setActive("medicalTab");

        fetch(`https://migrantwokerscentralisedplatform-1.onrender.com/migrant/patient/medical/reports?patient_id=${patientId}`,{
            headers:{Authorization:"Bearer "+token}
        })
        .then(r=>r.json())
        .then(data=>{
            recordsBox.innerHTML="";
            data.forEach(r=>{
                recordsBox.innerHTML+=`
                <div class="row">
                    <div>${new Date(r.created_at).toLocaleDateString()}</div>
                    <div>${r.hospital_name}</div>
                    <div>${r.department}</div>
                    <div><span class="tag medical">Medical</span></div>
                    <div>
                        <button class="btn" onclick='openDetails(${JSON.stringify(r)})'>View</button>
                    </div>
                </div>`;
            });
        });
    }

    /* ===== TEST ===== */
    function loadTests(){
        setActive("testTab");

        fetch(`https://migrantwokerscentralisedplatform-1.onrender.com/doctor/patient/medical/files?patient_id=${patientId}`,{
            headers:{ Authorization:"Bearer "+token }
        })
        .then(r=>r.json())
        .then(data=>{
            recordsBox.innerHTML="";
            data.forEach(r=>{
                recordsBox.innerHTML+=`
                <div class="row">
                    <div>${new Date(r.created_at).toLocaleDateString()}</div>
                    <div>${r.report_category}</div>
                    <div>${r.report_types}</div>
                    <div><span class="tag test">Test</span></div>
                    <div>
                        <button class="btn" onclick='openTestReport(${JSON.stringify(r)})'>View</button>
                    </div>
                </div>`;
            });
        });
    }

    /* ✅ THIS IS THE ONLY FIX */
    function openDetails(record){
        localStorage.setItem("selectedMedicalRecord", JSON.stringify(record));
        window.location.href = `medical_record_view.html?patient_id=${patientId}`;
    }

    function openTestReport(record){
        localStorage.setItem("selectedTestReport", JSON.stringify(record));
        window.location.href = `test_report_view.html?patient_id=${patientId}`;
    }

    loadMedical();
</script>

</body>
</html>
