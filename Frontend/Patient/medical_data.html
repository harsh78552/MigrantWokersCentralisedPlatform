<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Health Records</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- AUTH -->
    <script>
        const token = localStorage.getItem("patientToken");
        const params = new URLSearchParams(window.location.search);
        const patientId = params.get("patient_id") || localStorage.getItem("patientId");

        if (!token || !patientId) {
            window.location.replace("login.html");
        }

        localStorage.setItem("patientId", patientId);

        fetch("https://migrantwokerscentralisedplatform-1.onrender.com/check/token", {
            headers: { Authorization: "Bearer " + token }
        })
        .then(res => { if (!res.ok) logout(); })
        .catch(logout);

        function logout(){
            localStorage.clear();
            window.location.replace("login.html");
        }
    </script>

    <style>
        body{margin:0;font-family:Segoe UI;background:#f2f6fb}
        header{background:#0a4fbf;color:#fff;padding:20px;font-size:22px;font-weight:700}
        .topbar{background:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}
        .tab-btn{padding:10px 20px;border:1px solid #ccc;border-radius:6px;font-weight:700;cursor:pointer}
        .tab-btn.active{background:#0a4fbf;color:#fff}
        .container{max-width:1200px;margin:20px auto;background:#fff;border-radius:8px}
        .table-header,.row{display:grid;grid-template-columns:140px 1.3fr 1fr 120px 120px;padding:14px}
        .table-header{background:#f1f5fb;font-weight:800}
        .row{border-bottom:1px solid #eee}
        .btn{padding:8px 14px;border:none;background:#0a4fbf;color:#fff;border-radius:6px;cursor:pointer}
        .tag{padding:5px 12px;border-radius:20px;color:#fff;font-size:12px;font-weight:700}
        .tag.medical{background:#2563eb}
        .tag.test{background:#059669}
        .empty,.error{text-align:center;padding:40px}
        .error{color:red}
    </style>
</head>

<body>

<header>Patient Health Records</header>

<div class="topbar">
    <div>Patient ID: <b id="pid"></b></div>
    <div>
        <button id="medicalTab" class="tab-btn active" onclick="loadMedical()">Medical</button>
        <button id="testTab" class="tab-btn" onclick="loadTests()">Tests</button>
    </div>
</div>

<div class="container">
    <div class="table-header">
        <div>Date</div>
        <div>Hospital / Lab</div>
        <div>Department / Test</div>
        <div>Type</div>
        <div>Action</div>
    </div>
    <div id="records">
        <div class="empty">Loading records…</div>
    </div>
</div>

<script>
    document.getElementById("pid").innerText = patientId;
    const recordsBox = document.getElementById("records");
    let medicalRecords = [];
    let testRecords = [];

    function setActive(tab){
        medicalTab.classList.remove("active");
        testTab.classList.remove("active");
        document.getElementById(tab).classList.add("active");
    }

    /* ===== MEDICAL RECORDS ===== */
    function loadMedical(){
        setActive("medicalTab");
        recordsBox.innerHTML="<div class='empty'>Loading medical records…</div>";

        fetch(`https://migrantwokerscentralisedplatform-1.onrender.com/migrant/patient/medical/reports?patient_id=${patientId}`,{
            headers:{ Authorization:"Bearer "+token }
        })
        .then(r=>r.json())
        .then(data=>{
            medicalRecords = data || [];
            recordsBox.innerHTML="";

            if(!medicalRecords.length){
                recordsBox.innerHTML="<div class='empty'>No medical records</div>";
                return;
            }

            medicalRecords.forEach((r,i)=>{
                recordsBox.innerHTML+=`
                <div class="row">
                    <div>${new Date(r.created_at).toLocaleDateString()}</div>
                    <div>${r.hospital_name}</div>
                    <div>${r.department}</div>
                    <div><span class="tag medical">Medical</span></div>
                    <div><button class="btn" onclick="openMedical(${i})">View</button></div>
                </div>`;
            });
        })
        .catch(()=>recordsBox.innerHTML="<div class='error'>Failed to load medical records</div>");
    }

    /* ===== TEST REPORTS ===== */
    function loadTests(){
        setActive("testTab");
        recordsBox.innerHTML="<div class='empty'>Loading test reports…</div>";

        fetch(`https://migrantwokerscentralisedplatform-1.onrender.com/doctor/patient/medical/files?patient_id=${patientId}`,{
            headers:{ Authorization:"Bearer "+token }
        })
        .then(r=>r.json())
        .then(data=>{
            testRecords = data || [];
            recordsBox.innerHTML="";

            if(!testRecords.length){
                recordsBox.innerHTML="<div class='empty'>No test reports</div>";
                return;
            }

            testRecords.forEach((r,i)=>{
                recordsBox.innerHTML+=`
                <div class="row">
                    <div>${new Date(r.created_at).toLocaleDateString()}</div>
                    <div>${r.report_category}</div>
                    <div>${r.report_types}</div>
                    <div><span class="tag test">Test</span></div>
                    <div><button class="btn" onclick="openTest(${i})">View</button></div>
                </div>`;
            });
        })
        .catch(()=>recordsBox.innerHTML="<div class='error'>Failed to load test reports</div>");
    }

    /* ===== OPEN PAGES ===== */
    function openMedical(i){
        localStorage.setItem("selectedMedicalRecord", JSON.stringify(medicalRecords[i]));
        window.location.href = `medical_record_view.html?patient_id=${patientId}`;
    }

    function openTest(i){
        localStorage.setItem("selectedTestReport", JSON.stringify(testRecords[i]));
        window.location.href = `test_report_view.html?patient_id=${patientId}`;
    }

    /* DEFAULT LOAD */
    loadMedical();
</script>

</body>
</html>
