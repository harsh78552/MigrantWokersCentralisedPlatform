<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Health Records</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- AUTH + PATIENT ID -->
    <script>
        const token = localStorage.getItem("patientToken");
        const params = new URLSearchParams(window.location.search);
        let patientId = params.get("patient_id") || localStorage.getItem("patientId");

        if (!token || !patientId) {
            window.location.replace("login.html");
        }

        localStorage.setItem("patientId", patientId);

        fetch("https://migrantwokerscentralisedplatform-1.onrender.com/check/token", {
            headers: { "Authorization": "Bearer " + token }
        })
        .then(res => { if (!res.ok) forceLogout(); })
        .catch(() => forceLogout());

        function forceLogout(){
            localStorage.clear();
            window.location.replace("login.html");
        }
    </script>

    <!-- STYLES UNCHANGED -->
    <style>
        :root{
            --primary:#0a4fbf;
            --primary-dark:#083a8f;
            --accent:#eaf1ff;
            --bg:#f2f6fb;
            --card:#ffffff;
            --border:#dbe2ea;
            --text:#1e293b;
            --muted:#64748b;
            --medical:#2563eb;
            --test:#059669;
        }
        *{box-sizing:border-box}
        body{margin:0;font-family:"Segoe UI",Arial;background:var(--bg)}
        header{background:#0a4fbf;color:#fff;padding:22px}
        .topbar{background:#fff;padding:14px;display:flex;justify-content:space-between}
        .tab-btn.active{background:var(--primary);color:#fff}
        .container{max-width:1200px;margin:26px auto;background:#fff}
        .table-header,.row{display:grid;grid-template-columns:140px 1.3fr 1fr 120px 120px;padding:16px}
        .btn{background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:6px}
        .tag.medical{background:var(--medical)}
        .tag.test{background:var(--test)}
        .empty,.error{text-align:center;padding:40px}
    </style>
</head>

<body>

<header>
    <h1>Patient Health Records</h1>
</header>

<div class="topbar">
    <div class="left">
        <div class="badge">Patient ID: <span id="pid"></span></div>
    </div>
    <div class="tabs">
        <button id="medicalTab" class="tab-btn active" onclick="loadMedical()">Medical</button>
        <button id="testTab" class="tab-btn" onclick="loadTests()">Test</button>
    </div>
</div>

<div class="container">
    <div class="table-header">
        <div>Date</div>
        <div>Hospital / Lab</div>
        <div>Department / Test</div>
        <div>Type</div>
        <div>Action</div>
    </div>
    <div id="records">
        <div class="empty">Loading health records…</div>
    </div>
</div>

<script>
    document.getElementById("pid").innerText = patientId;
    const recordsBox = document.getElementById("records");

    function setActive(tab){
        medicalTab.classList.remove("active");
        testTab.classList.remove("active");
        document.getElementById(tab).classList.add("active");
    }

    /* ===== MEDICAL (UNCHANGED) ===== */
    function loadMedical(){
        setActive("medicalTab");

        fetch(`https://migrantwokerscentralisedplatform-1.onrender.com/migrant/patient/medical/reports?patient_id=${patientId}`,{
            headers:{Authorization:"Bearer "+token}
        })
        .then(r=>r.json())
        .then(data=>{
            recordsBox.innerHTML="";
            data.forEach(r=>{
                recordsBox.innerHTML+=`
                <div class="row">
                    <div>${new Date(r.created_at).toLocaleDateString()}</div>
                    <div>${r.hospital_name}</div>
                    <div>${r.department}</div>
                    <div><span class="tag medical">Medical</span></div>
                    <div>
                        <button class="btn" onclick='openDetails(${JSON.stringify(r)})'>View</button>
                    </div>
                </div>`;
            });
        });
    }

    /* ===== TEST (FIXED ONLY HERE) ===== */
    function loadTests(){
        setActive("testTab");

        fetch(`https://migrantwokerscentralisedplatform-1.onrender.com/doctor/patient/medical/files?patient_id=${patientId}`,{
            headers:{ Authorization:"Bearer "+token }
        })
        .then(r => r.json())
        .then(data => {

            recordsBox.innerHTML = "";

            // ✅ STRICT FIX
            const records = Array.isArray(data)
                ? data
                : (Array.isArray(data.data) ? data.data : []);

            records.forEach(r => {
                recordsBox.innerHTML += `
                <div class="row">
                    <div>${new Date(r.created_at).toLocaleDateString()}</div>
                    <div>${r.report_category}</div>
                    <div>${r.report_types}</div>
                    <div><span class="tag test">Test</span></div>
                    <div>
                        <button class="btn"
                            onclick='openTestReport(${JSON.stringify(r)})'>
                            View
                        </button>
                    </div>
                </div>`;
            });
        });
    }

    function openDetails(record){
        localStorage.setItem("selectedMedicalRecord", JSON.stringify(record));
        window.location.href = `record_details.html?patient_id=${patientId}`;
    }

    function openTestReport(record){
        localStorage.setItem("selectedTestReport", JSON.stringify(record));
        window.location.href = `test_report_view.html?patient_id=${patientId}`;
    }

    loadMedical();
</script>

</body>
</html>
