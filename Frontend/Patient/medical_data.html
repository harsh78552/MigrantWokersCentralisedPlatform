<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Health Records</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root{
            --primary:#0f766e;
            --bg:#f0fdfa;
        }
        body{
            margin:0;
            font-family:Arial;
            background:var(--bg);
        }
        header{
            background:var(--primary);
            color:#fff;
            padding:20px;
        }
        .container{
            max-width:1100px;
            margin:20px auto;
        }
        .tabs button{
            padding:10px 18px;
            border:none;
            border-radius:20px;
            margin-right:8px;
            cursor:pointer;
        }
        .active{
            background:var(--primary);
            color:#fff;
        }
        .card{
            background:#fff;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,.06);
            margin-bottom:10px;
        }
        .row,.head{
            display:grid;
            grid-template-columns:140px 1fr 120px 140px;
            padding:14px;
            align-items:center;
        }
        .head{
            font-weight:bold;
            background:#ecfeff;
        }
        .btn{
            background:var(--primary);
            color:#fff;
            border:none;
            padding:6px 14px;
            border-radius:6px;
            cursor:pointer;
        }
        .center{
            text-align:center;
            padding:30px;
            color:#666;
        }
    </style>

    <script>
        const token = localStorage.getItem("patientToken");
        const patientId = localStorage.getItem("patientId");
        if(!token || !patientId){
            location.replace("login.html");
        }
    </script>
</head>

<body>

<header>
    <h2>My Health Records</h2>
    <p>Patient ID: <b id="pid"></b></p>
</header>

<div class="container">

    <div class="tabs">
        <button id="medBtn" class="active" onclick="loadMedical()">Medical</button>
        <button id="testBtn" onclick="loadTests()">Reports</button>
    </div>

    <div class="card head">
        <div>Date</div>
        <div>Hospital / Lab</div>
        <div>Type</div>
        <div>Action</div>
    </div>

    <div id="records"></div>

</div>

<script>
    pid.innerText = patientId;
    const box = document.getElementById("records");

    function setTab(med){
        medBtn.classList.toggle("active", med);
        testBtn.classList.toggle("active", !med);
    }
    function showLoading(){
        box.innerHTML = `<div class="center">Loading records...</div>`;
    }
    function showEmpty(){
        box.innerHTML = `<div class="center">No records found</div>`;
    }

    function loadMedical(){
    setTab(true);
    showLoading();
    fetch(`https://migrantwokerscentralisedplatform-1.onrender.com/migrant/patient/medical/reports?patient_id=${patientId}`,{
    headers:{Authorization:"Bearer "+token}
    })
    .then(r=>r.json())
    .then(data=>{
        if(!data.length){ showEmpty(); return; }
        box.innerHTML="";
        data.forEach(r=>{
            box.innerHTML+=`
            <div class="card row">
                <div>${new Date(r.created_at).toLocaleDateString()}</div>
                <div>${r.hospital_name}</div>
                <div>Medical</div>
                <div><button class="btn" onclick='openMedical(${JSON.stringify(r)})'>View Details</button></div>
            </div>`;
        });
    });
    }

    function loadTests(){
    setTab(false);
    showLoading();
    fetch(`https://migrantwokerscentralisedplatform-1.onrender.com/migrant/patient/report/files?patient_id=${patientId}`,{
    headers:{Authorization:"Bearer "+token}
    })
    .then(r=>r.json())
    .then(data=>{
        if(!data.length){ showEmpty(); return; }
        box.innerHTML="";
        data.forEach(r=>{
            box.innerHTML+=`
            <div class="card row">
                <div>${new Date(r.created_at).toLocaleDateString()}</div>
                <div>${r.report_category}</div>
                <div>Report</div>
                <div><button class="btn" onclick='openTest(${JSON.stringify(r)})'>Open Report</button></div>
            </div>`;
        });
    });
    }

    function openMedical(r){
    localStorage.setItem("medicalRecord", JSON.stringify(r));
    location.href="record_details.html";
    }

    function openTest(r){
    localStorage.setItem("testRecord", JSON.stringify(r));
    location.href="test_report_view.html";
    }

    loadMedical();
</script>

</body>
</html>
