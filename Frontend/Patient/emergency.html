<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emergency SOS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- AUTH CHECK (UNCHANGED) -->
    <script>
        const token = localStorage.getItem("patientToken");
        const params = new URLSearchParams(window.location.search);
        let patientId = params.get("patient_id") || localStorage.getItem("patientId");

        if (!token || !patientId) {
            window.location.replace("login.html");
        }
        localStorage.setItem("patientId", patientId);

        fetch("https://migrantwokerscentralisedplatform-1.onrender.com/check/token", {
            headers: { "Authorization": "Bearer " + token }
        })
        .then(res => { if (!res.ok) forceLogout(); })
        .catch(() => forceLogout());

        window.history.pushState(null,null,location.href);
        window.onpopstate = ()=>window.history.pushState(null,null,location.href);

        function forceLogout(){
            localStorage.clear();
            window.location.replace("login.html");
        }
    </script>

    <style>
        :root{
            --red:#ef4444;
            --dark-red:#b91c1c;
            --green:#22c55e;
            --blue:#2563eb;
            --bg:linear-gradient(135deg,#eef2ff,#f8fafc);
            --text:#111827;
        }

        *{box-sizing:border-box}

        body{
            margin:0;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:var(--bg);
            font-family:system-ui,Arial;
            padding:16px;
        }

        /* WRAPPER FOR LARGE SCREENS */
        .wrapper{
            width:100%;
            max-width:460px;
        }

        /* CARD */
        .card{
            background:rgba(255,255,255,0.96);
            padding:32px 26px;
            border-radius:26px;
            text-align:center;
            box-shadow:0 30px 70px rgba(0,0,0,0.15);
        }

        /* ICON */
        .icon{
            width:92px;
            height:92px;
            background:var(--red);
            color:white;
            font-size:42px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:auto;
            animation:pulse 2s infinite;
        }

        h2{
            margin:20px 0 6px;
            font-size:22px;
        }
        .sub{
            font-size:14px;
            color:#6b7280;
            margin-bottom:28px;
        }

        /* BUTTONS */
        .btn{
            width:100%;
            padding:18px;
            font-size:18px;
            border:none;
            border-radius:999px;
            color:white;
            font-weight:600;
            cursor:pointer;
            margin-bottom:14px;
        }

        .normal{background:var(--green)}
        .critical{background:var(--red)}

        .btn:disabled{
            background:#9ca3af;
            cursor:not-allowed;
        }

        /* STATUS */
        .status{
            margin-top:16px;
            font-size:15px;
            font-weight:600;
            min-height:24px;
        }

        .info{color:var(--blue)}
        .success{color:var(--green)}
        .error{color:var(--red)}

        /* LOADER */
        .loader{
            width:18px;
            height:18px;
            border:3px solid #e5e7eb;
            border-top:3px solid var(--blue);
            border-radius:50%;
            display:inline-block;
            animation:spin 1s linear infinite;
            margin-right:6px;
            vertical-align:middle;
        }

        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes pulse{
            0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}
            70%{box-shadow:0 0 0 22px rgba(239,68,68,0)}
            100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}
        }

        /* DESKTOP ENHANCEMENT */
        @media(min-width:768px){
            .card{
                padding:38px 34px;
            }
            h2{font-size:24px}
        }
    </style>
</head>

<body>

<div class="wrapper">
    <div class="card">

        <div class="icon">🚨</div>
        <h2>Emergency SOS</h2>
        <p class="sub">Use only for serious medical emergencies</p>

        <button id="normalBtn" class="btn normal">🟢 Normal Emergency</button>
        <button id="criticalBtn" class="btn critical">🔴 Critical Emergency</button>

        <div id="status" class="status"></div>

    </div>
</div>

<!-- LOGIC UNCHANGED -->
<script>
    const statusText = document.getElementById("status");
    const normalBtn = document.getElementById("normalBtn");
    const criticalBtn = document.getElementById("criticalBtn");

    normalBtn.onclick = () => startEmergency("normal");
    criticalBtn.onclick = () => startEmergency("critical");

    function startEmergency(severity){
        normalBtn.disabled = true;
        criticalBtn.disabled = true;

        statusText.className = "status info";
        statusText.innerHTML = `<span class="loader"></span>`;

        navigator.geolocation.getCurrentPosition(
            pos => sendEmergency(pos, severity),
            err => {
                statusText.className = "status error";
                statusText.innerText = err.message;
                normalBtn.disabled = false;
                criticalBtn.disabled = false;
            },
            { enableHighAccuracy:true, timeout:15000 }
        );
    }

    function sendEmergency(position, severity){
        const payload = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy,
            timestamp: new Date().toISOString(),
            severity
        };

        fetch("https://migrantwokerscentralisedplatform-1.onrender.com/patient/emergency",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer "+localStorage.getItem("patientToken")
            },
            body:JSON.stringify(payload)
        })
        .then(async res=>{
            const data = await res.json();
            if(!res.ok) throw data;
            return data;
        })
        .then(data=>{
            statusText.className = "status success";
            statusText.innerText = data.message;
        })
        .catch(err=>{
            statusText.className = "status error";
            statusText.innerText = err.message;
            normalBtn.disabled = false;
            criticalBtn.disabled = false;
        });
    }
</script>

</body>
</html>
