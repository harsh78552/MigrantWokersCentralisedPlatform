<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emergency SOS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- AUTH CHECK -->
    <script>
        const token = localStorage.getItem("patientToken");

        if (!token) {
            window.location.replace("login.html");
        } else {
            fetch("http://127.0.0.1:5000/check/token", {
                headers: { "Authorization": "Bearer " + token }
            }).then(res => {
                if (!res.ok) logout();
            }).catch(() => logout());
        }

        function logout() {
            localStorage.clear();
            window.location.replace("login.html");
        }
    </script>

    <style>
        :root {
            --red: #ef4444;
            --dark-red: #b91c1c;
            --green: #22c55e;
            --blue: #2563eb;
            --bg: linear-gradient(135deg, #eef2ff, #f8fafc);
            --text: #111827;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            font-family: "Inter", Arial, sans-serif;
        }

        .card {
            background: rgba(255,255,255,0.95);
            width: 92%;
            max-width: 420px;
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.15);
        }

        .icon {
            width: 90px;
            height: 90px;
            background: var(--red);
            color: white;
            font-size: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            animation: pulse 2s infinite;
        }

        h2 { margin: 18px 0 6px; }
        .sub { font-size: 14px; color: #6b7280; margin-bottom: 26px; }

        .btn {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            border: none;
            border-radius: 999px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .normal { background: var(--green); }
        .critical { background: var(--red); }

        .btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .status {
            margin-top: 16px;
            font-size: 15px;
            font-weight: 600;
            min-height: 24px;
        }

        .info { color: var(--blue); }
        .success { color: var(--green); }
        .error { color: var(--red); }

        .loader {
            width: 18px;
            height: 18px;
            border: 3px solid #e5e7eb;
            border-top: 3px solid var(--blue);
            border-radius: 50%;
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
            70% { box-shadow: 0 0 0 20px rgba(239,68,68,0); }
            100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
        }
    </style>
</head>

<body>

<div class="card">
    <div class="icon">🚨</div>
    <h2>Emergency SOS</h2>
    <p class="sub">Tap only in serious medical emergencies</p>

    <!-- TWO BUTTONS -->
    <button id="normalBtn" class="btn normal">🟢 Normal Emergency</button>
    <button id="criticalBtn" class="btn critical">🔴 Critical Emergency</button>

    <!-- MESSAGE FROM BACKEND -->
    <div id="status" class="status"></div>
</div>

<script>
    const statusText = document.getElementById("status");
    const normalBtn = document.getElementById("normalBtn");
    const criticalBtn = document.getElementById("criticalBtn");

    normalBtn.onclick = () => startEmergency("normal");
    criticalBtn.onclick = () => startEmergency("critical");

    function startEmergency(severity) {
        normalBtn.disabled = true;
        criticalBtn.disabled = true;

        statusText.className = "status info";
        statusText.innerHTML = `<span class="loader"></span>`;

        navigator.geolocation.getCurrentPosition(
            pos => sendEmergency(pos, severity),
            err => {
                // browser-generated message (only unavoidable case)
                statusText.className = "status error";
                statusText.innerText = err.message;
                normalBtn.disabled = false;
                criticalBtn.disabled = false;
            },
            { enableHighAccuracy: true, timeout: 15000 }
        );
    }

    function sendEmergency(position, severity) {
        const payload = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy,
            timestamp: new Date().toISOString(),
            severity: severity
        };

        // developer debug
        console.log("Emergency payload:", payload);

        fetch("http://127.0.0.1:5000/patient/emergency", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + localStorage.getItem("patientToken")
            },
            body: JSON.stringify(payload)
        })
        .then(async res => {
            const data = await res.json();
            if (!res.ok) throw data;
            return data;
        })
        .then(data => {
            // ✅ ONLY backend message shown
            statusText.className = "status success";
            statusText.innerText = data.message;
        })
        .catch(err => {
            statusText.className = "status error";
            statusText.innerText = err.message;
            normalBtn.disabled = false;
            criticalBtn.disabled = false;
        });
    }
</script>

</body>
</html>
