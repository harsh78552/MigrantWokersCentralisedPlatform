<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Medical Reports</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        const token = localStorage.getItem("patientToken");
        const params = new URLSearchParams(window.location.search);
        let patientId = params.get("patient_id") || localStorage.getItem("patientId");

        if (!token || !patientId) {
            window.location.replace("login.html");
        }

        localStorage.setItem("patientId", patientId);


        fetch("https://migrantwokerscentralisedplatform-1.onrender.com/check/token", {
            headers: { "Authorization": "Bearer " + token }
        })
        .then(res => { if (!res.ok) forceLogout(); })
        .catch(() => forceLogout());


        window.history.pushState(null,null,location.href);
        window.onpopstate = ()=>window.history.pushState(null,null,location.href);

        function forceLogout(){
            localStorage.clear();
            window.location.replace("login.html");
        }
    </script>

    <style>
        body{
            margin:0;
            background:#eef3f8;
            font-family:"Segoe UI", Arial, sans-serif;
        }

        /* HEADER */
        header{
            background:#0b5ed7;
            color:white;
            padding:16px;
            text-align:center;
            font-size:18px;
            font-weight:600;
        }

        /* PAGE */
        .container{
            padding:18px;
            max-width:1200px;
            margin:auto;
        }

        /* SECTION */
        .section{
            background:white;
            border-radius:16px;
            padding:18px;
            margin-bottom:22px;
            box-shadow:0 6px 15px rgba(0,0,0,.08);
        }

        .section-title{
            font-size:16px;
            font-weight:600;
            margin-bottom:14px;
            color:#333;
        }

        /* GRID (AUTO FIT – KEY FIX) */
        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
            gap:14px;
        }

        /* REPORT BUTTON */
        .report-btn{
            padding:14px 10px;
            border:none;
            border-radius:14px;
            background:#f1f5ff;
            color:#0b5ed7;
            font-size:14px;
            font-weight:500;
            cursor:pointer;
            transition:.2s;
            text-align:center;
        }

        .report-btn:hover{
            background:#0b5ed7;
            color:white;
            transform:translateY(-2px);
        }

        /* BACK BUTTON */
        .back-btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:14px;
            background:#0b5ed7;
            color:white;
            font-size:15px;
            margin-top:10px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<header>My Medical Reports</header>

<div class="container">

    <div class="section">
        <div class="section-title">🩸 Lab Test Reports</div>
        <div class="grid">
            <button class="report-btn">Blood Test</button>
            <button class="report-btn">Urine Test</button>
            <button class="report-btn">Sugar Test</button>
            <button class="report-btn">Thyroid</button>
            <button class="report-btn">Lipid Profile</button>
            <button class="report-btn">LFT / KFT</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">🩻 Scans & Imaging</div>
        <div class="grid">
            <button class="report-btn">X-Ray</button>
            <button class="report-btn">MRI Scan</button>
            <button class="report-btn">CT Scan</button>
            <button class="report-btn">Ultrasound</button>
            <button class="report-btn">ECG</button>
            <button class="report-btn">ECHO</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">💊 Prescription & Treatment</div>
        <div class="grid">
            <button class="report-btn">Prescription</button>
            <button class="report-btn">Treatment Summary</button>
            <button class="report-btn">Medication Schedule</button>
            <button class="report-btn">Follow-up Advice</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">🏥 Hospital Documents</div>
        <div class="grid">
            <button class="report-btn">OPD Slip</button>
            <button class="report-btn">Discharge Summary</button>
            <button class="report-btn">Admission Record</button>
            <button class="report-btn">Hospital Bill</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">🧠 Specialised Reports</div>
        <div class="grid">
            <button class="report-btn">Cardiology</button>
            <button class="report-btn">Neurology</button>
            <button class="report-btn">Orthopedic</button>
            <button class="report-btn">ENT / Eye</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">💉 Vaccination & Preventive</div>
        <div class="grid">
            <button class="report-btn">Vaccination</button>
            <button class="report-btn">COVID Report</button>
            <button class="report-btn">Immunization Card</button>
            <button class="report-btn">Health Checkup</button>
        </div>
    </div>

    <button class="back-btn" onclick="goBack()">Back</button>

</div>

<script>
    function goBack(){
        window.location.href="main_page.html";
    }
</script>

</body>
</html>
