<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body{
            margin:0;
            font-family:Arial;
            background:#f0fdfa;
        }
        header{
            background:#0f766e;
            color:white;
            padding:16px;
        }
        .container{
            max-width:900px;
            margin:20px auto;
        }
        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,.06);
        }
        .viewer{
            margin-top:20px;
        }
        .viewer img, .viewer iframe{
            width:100%;
            height:600px;
            border:none;
        }
        .btn{
            background:#0f766e;
            color:white;
            border:none;
            padding:8px 18px;
            border-radius:6px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<header>
    <h3>Medical Report</h3>
</header>

<div class="container">
    <div class="card" id="content"></div>
</div>

<script>
    const record = JSON.parse(localStorage.getItem("testRecord"));
    const box = document.getElementById("content");

    if(!record){
        box.innerHTML="No report found";
    }else{
        const fileUrl = record.report_file || record.file_url;

        box.innerHTML = `
        <p><b>Category:</b> ${record.report_category}</p>
        <p><b>Date:</b> ${new Date(record.created_at).toLocaleDateString()}</p>

        <div class="viewer">
            ${fileUrl.endsWith(".pdf")
                ? `<iframe src="${fileUrl}"></iframe>`
                : `<img src="${fileUrl}" alt="Report Image">`
            }
        </div>

        <br>
        <button class="btn" onclick="history.back()">⬅ Back</button>
        `;
    }
</script>

</body>
</html>
