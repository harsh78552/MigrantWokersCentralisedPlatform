<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Report</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body{
            margin:0;
            font-family:Arial;
            background:#f4f6fb;
        }
        header{
            background:#0a4fbf;
            color:#fff;
            padding:18px 22px;
        }
        .container{
            max-width:800px;
            margin:30px auto;
        }
        .card{
            background:#fff;
            padding:24px;
            border-radius:8px;
            box-shadow:0 4px 10px rgba(0,0,0,.06);
        }
        .row{
            display:flex;
            margin-bottom:12px;
        }
        .label{
            width:160px;
            font-weight:bold;
            color:#444;
        }
        .value{
            color:#222;
        }
        .btn{
            background:#0a4fbf;
            color:#fff;
            border:none;
            padding:8px 18px;
            border-radius:5px;
            cursor:pointer;
        }
        .footer{
            margin-top:25px;
            text-align:right;
        }
        .empty{
            text-align:center;
            padding:40px;
            color:#666;
        }
    </style>
</head>

<body>

<header>
    <h2>Test Report Details</h2>
</header>

<div class="container">
    <div class="card" id="data"></div>
</div>

<script>
    const record = JSON.parse(localStorage.getItem("testRecord"));
    const box = document.getElementById("data");

    if(!record){
        box.innerHTML = `<div class="empty">No report found</div>`;
        setTimeout(()=>location.replace("patient_records.html"),1500);
    }else{
        box.innerHTML = `
        <div class="row">
            <div class="label">Report Category</div>
            <div class="value">${record.report_category || "N/A"}</div>
        </div>

        <div class="row">
            <div class="label">Report Type</div>
            <div class="value">${record.report_types || "N/A"}</div>
        </div>

        <div class="row">
            <div class="label">Report Date</div>
            <div class="value">${new Date(record.created_at).toLocaleDateString()}</div>
        </div>

        <div class="row">
            <div class="label">Description</div>
            <div class="value">${record.description || "No description provided"}</div>
        </div>

        <div class="footer">
            <button class="btn" onclick="goBack()">⬅ Back to Records</button>
        </div>
        `;
    }

    function goBack(){
        location.href = "patient_records.html";
    }
</script>

</body>
</html>
