<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title id="txt-health-card-title">Health Card</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- QR CODE LIB -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

    <style>
        body{
            margin:0;
            background:#eef3f8;
            font-family:"Segoe UI", Arial, sans-serif;
        }

        .card{
            max-width:360px;
            margin:40px auto;
            background:#fff;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 12px 30px rgba(0,0,0,.15);
        }

        .card-header{
            background:linear-gradient(135deg,#0b5ed7,#0d6efd);
            padding:25px 15px 55px;
            text-align:center;
            position:relative;
        }

        .photo{
            width:100px;
            height:100px;
            border-radius:50%;
            object-fit:cover;
            border:4px solid #fff;
            background:#fff;
            position:absolute;
            left:50%;
            bottom:-50px;
            transform:translateX(-50%);
        }

        .card-body{
            padding:70px 22px 20px;
        }

        .name{
            text-align:center;
            font-size:22px;
            font-weight:600;
            margin-bottom:22px;
        }

        .info{
            font-size:14px;
            margin-bottom:12px;
            color:#333;
        }

        .label{
            font-weight:600;
            color:#555;
        }

        .address-box{
            margin-top:6px;
            padding:10px 12px;
            background:#f7f9fc;
            border:1px solid #e0e6ed;
            border-radius:8px;
            white-space:pre-line;
            line-height:1.5;
        }

        .qr{
            margin:20px auto 10px;
            text-align:center;
            padding-top:12px;
            border-top:1px dashed #ccc;
        }

        .qr img,
        .qr canvas{
            pointer-events:none !important;
        }

        .qr{
            user-select:none;
        }

        .qr small{
            display:block;
            margin-top:6px;
            color:#777;
            font-size:12px;
        }

        .back-btn{
            margin:18px;
            padding:12px;
            width:calc(100% - 36px);
            border:none;
            border-radius:12px;
            background:#0b5ed7;
            color:white;
            font-size:15px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<script>
    if(!localStorage.getItem("patientToken")){
        location.href="login.html";
    }
</script>

<div class="card">

    <div class="card-header">
        <img id="photo" class="photo" alt="Profile Photo">
    </div>

    <div class="card-body">
        <div class="name" id="full_name"></div>

        <div class="info">
            <span class="label" id="txt-patient-id">Patient ID:</span>
            <span id="pid"></span>
        </div>

        <div class="info">
            <span class="label" id="txt-blood-group">Blood Group:</span>
            <span id="blood"></span>
        </div>

        <div class="info">
            <span class="label" id="txt-address">Address:</span>
            <div class="address-box" id="address"></div>
        </div>

        <div class="qr">
            <div id="qrcode"></div>
            <small id="txt-scan">Scan for medical access</small>
        </div>
    </div>

    <button class="back-btn" id="txt-back" onclick="goBack()">Back</button>
</div>

<!-- DATA + QR -->
<script>
    const data = JSON.parse(localStorage.getItem("healthCardData"));
    if(!data){
        alert("No health card data found");
        location.href="main_page.html";
    }

    full_name.innerText = data.full_name;
    pid.innerText = data.patient_id;
    blood.innerText = data.blood_group;
    address.innerText = data.current_address;

    photo.src = (data.profile_photo && data.profile_photo.startsWith("http"))
        ? data.profile_photo
        : "https://cdn-icons-png.flaticon.com/512/847/847969.png";

    const qrText = `Patient ID : ${data.patient_id}`;
    new QRCode(document.getElementById("qrcode"),{
        text: qrText,
        width:120,
        height:120
    });

    function goBack(){
        location.href="main_page.html";
    }
</script>
</body>
</html>
