<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Record Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        const token = localStorage.getItem("patientToken");
        const params = new URLSearchParams(window.location.search);
        let patientId = params.get("patient_id") || localStorage.getItem("patientId");

        if (!token || !patientId) {
            window.location.replace("login.html");
        }

        localStorage.setItem("patientId", patientId);

        fetch("https://migrantwokerscentralisedplatform-1.onrender.com/check/token", {
            headers: { "Authorization": "Bearer " + token }
        })
        .then(res => { if (!res.ok) forceLogout(); })
        .catch(() => forceLogout());

        function forceLogout(){
            localStorage.clear();
            window.location.replace("login.html");
        }
    </script>

    <!-- STYLES UNCHANGED -->
    <style>
        :root{
            --primary:#0b5ed7;
            --primary-dark:#084298;
            --bg:#f4f7fb;
            --card:#ffffff;
            --border:#e5e7eb;
            --text:#1e293b;
            --muted:#64748b;
        }
        *{box-sizing:border-box}
        body{margin:0;font-family:"Segoe UI";background:var(--bg)}
        header{background:#0b5ed7;color:#fff;padding:22px}
        .section{max-width:950px;margin:26px auto;background:#fff;padding:26px;border-radius:12px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
        .value{background:#f8fafc;padding:10px;border-radius:6px;border:1px solid var(--border)}
    </style>
</head>

<body>

<header>
    <h1>Medical Record Details</h1>
    <div class="sub">Patient Clinical Report</div>
</header>

<div class="section">
    <div class="grid">
        <div>
            <div class="label">Hospital Name</div>
            <div class="value" id="hospital"></div>
        </div>
        <div>
            <div class="label">Department</div>
            <div class="value" id="department"></div>
        </div>
        <div>
            <div class="label">Visit Date</div>
            <div class="value" id="date"></div>
        </div>
    </div>
</div>

<div class="section">
    <div class="grid">
        <div>
            <div class="label">Diagnosis</div>
            <div class="value" id="diagnosis"></div>
        </div>
        <div>
            <div class="label">Prescription</div>
            <div class="value" id="prescription"></div>
        </div>
        <div>
            <div class="label">Doctor Notes</div>
            <div class="value" id="notes"></div>
        </div>
        <div>
            <div class="label">Tests Advised</div>
            <div class="value" id="tests"></div>
        </div>
    </div>
</div>

<div class="actions">
    <button onclick="history.back()">Back</button>
    <button onclick="window.print()">Print</button>
</div>

<script>
    /* ✅ ONLY FIX */
    const record = JSON.parse(localStorage.getItem("selectedMedicalRecord"));

    if(!record){
        alert("No medical record found");
        history.back();
    }

    document.getElementById("hospital").innerText = record.hospital_name || "-";
    document.getElementById("department").innerText = record.department || "-";
    document.getElementById("date").innerText =
        new Date(record.date || record.created_at).toLocaleString();

    document.getElementById("diagnosis").innerText = record.diagnosis || "-";
    document.getElementById("prescription").innerText = record.prescription || "-";
    document.getElementById("notes").innerText = record.doctor_notes || "-";
    document.getElementById("tests").innerText = record.tests || "-";
</script>

</body>
</html>
