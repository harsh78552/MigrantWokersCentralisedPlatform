<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Record Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root{
            --primary:#0f766e;
            --bg:#f0fdfa;
            --card:#ffffff;
            --border:#e5e7eb;
            --text:#1f2937;
        }
        body{
            margin:0;
            font-family:Arial;
            background:var(--bg);
        }
        header{
            background:var(--primary);
            color:#fff;
            padding:22px;
        }
        .section{
            max-width:950px;
            margin:26px auto;
            background:#fff;
            padding:26px;
            border-radius:14px;
            box-shadow:0 6px 16px rgba(0,0,0,.06);
        }
        .grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:18px;
        }
        .label{
            font-weight:bold;
            margin-bottom:6px;
            color:#374151;
        }
        .value{
            background:#f9fafb;
            padding:12px;
            border-radius:8px;
            border:1px solid var(--border);
            min-height:42px;
        }
        .actions{
            max-width:950px;
            margin:0 auto 30px;
            display:flex;
            justify-content:space-between;
        }
        .actions button{
            background:var(--primary);
            color:white;
            border:none;
            padding:10px 22px;
            border-radius:8px;
            cursor:pointer;
        }
    </style>

    <script>
        const token = localStorage.getItem("patientToken");
        const patientId = localStorage.getItem("patientId");

        if(!token || !patientId){
            location.replace("login.html");
        }
    </script>
</head>

<body>

<header>
    <h2>Medical Record Details</h2>
    <p>Patient Clinical Report</p>
</header>

<div class="section">
    <div class="grid">
        <div>
            <div class="label">Hospital Name</div>
            <div class="value" id="hospital"></div>
        </div>
        <div>
            <div class="label">Department</div>
            <div class="value" id="department"></div>
        </div>
        <div>
            <div class="label">Visit Date</div>
            <div class="value" id="date"></div>
        </div>
    </div>
</div>

<div class="section">
    <div class="grid">
        <div>
            <div class="label">Diagnosis</div>
            <div class="value" id="diagnosis"></div>
        </div>
        <div>
            <div class="label">Prescription</div>
            <div class="value" id="prescription"></div>
        </div>
        <div>
            <div class="label">Doctor Notes</div>
            <div class="value" id="notes"></div>
        </div>
        <div>
            <div class="label">Tests Advised</div>
            <div class="value" id="tests"></div>
        </div>
    </div>
</div>

<div class="actions">
    <button onclick="history.back()">⬅ Back</button>
    <button onclick="window.print()">🖨 Print</button>
</div>

<script>
    /* ✅ CORRECT KEY */
    const record = JSON.parse(localStorage.getItem("medicalRecord"));

    if(!record){
        alert("No medical record found");
        history.back();
    }

    /* SAFE DATA BINDING */
    hospital.innerText = record.hospital_name || "N/A";
    department.innerText = record.department || "N/A";
    date.innerText = new Date(record.created_at).toLocaleString();

    diagnosis.innerText = record.diagnosis || "N/A";
    prescription.innerText = record.prescription || "N/A";
    notes.innerText = record.doctor_notes || "N/A";
    tests.innerText = record.tests || "N/A";
</script>

</body>
</html>
